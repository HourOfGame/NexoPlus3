name: Build NexoPlus JAR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Cho phép chạy thủ công

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexoPlus-JAR
          path: target/NexoPlus-*.jar
          retention-days: 30

      - name: Get version
        id: get_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}-build.${{ github.run_number }}
          name: NexoPlus v${{ steps.get_version.outputs.VERSION }} (Build ${{ github.run_number }})
          body: |
            ## NexoPlus Auto Build
            
            🔨 Built from commit: ${{ github.sha }}
            📅 Build date: ${{ github.event.head_commit.timestamp }}
            
            ### Cách dùng:
            1. Tải file `NexoPlus-1.0.0.jar` bên dưới
            2. Copy vào thư mục `plugins/` của server
            3. Khởi động server
          files: target/NexoPlus-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
