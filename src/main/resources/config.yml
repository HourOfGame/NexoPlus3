resourcepack:
  # Tự động build pack khi server khởi động
  auto_generate: true
  # Tự động gửi pack cho player khi join
  auto_send: true
  # Bắt buộc player phải dùng pack (kick nếu từ chối)
  required: false
  # Pack format: 1.20.x = 15, 1.19.x = 12, 1.18.x = 8
  pack_format: 15
  description: "NexoPlus ResourcePack"
  prompt_message: "Please accept the resource pack to see custom items!"

  # === Pack Hosting ===
  # Dùng HTTP server tích hợp sẵn (không cần host ngoài)
  use_builtin_host: true
  host_port: 8080
  # Nếu dùng URL ngoài, điền vào đây và tắt builtin host:
  # url: "https://cdn.yourserver.com/pack.zip"

database:
  # SQLITE (mặc định, không cần cài thêm) hoặc MYSQL
  type: SQLITE
  mysql:
    host: localhost
    port: 3306
    database: nexoplus
    username: root
    password: ""

settings:
  debug: false
  # Tự động gán CMD nếu item không có custom_model_data
  auto_assign_cmd: false
  # Phát hiện và cảnh báo CMD trùng lặp
  conflict_resolver: true
  # Language
  language: en
